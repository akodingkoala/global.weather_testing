<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Weather</title>
  <meta name="description" content="A pixel-art weather website with live global weather and interactive critters.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Animated pixel-art weather scene with critters"></canvas>
  <div id="bubbles" aria-live="polite"></div>

  <main id="hud">
    <section class="card" id="weather-card">
      <p id="place">Finding you...</p>
      <p id="temp">--</p>
      <p id="cond">Loading weather</p>
      <p id="extra"></p>
      <form id="search">
        <input id="city" type="text" placeholder="Search a city" autocomplete="off" aria-label="City name">
        <button type="submit">Go</button>
      </form>
      <div class="chips" id="chips"></div>
      <button id="locate" class="link" type="button">Use my location</button>
    </section>

    <section class="card" id="controls">
      <p class="label">Try the weather</p>
      <div class="buttons" id="modes">
        <button type="button" data-mode="live">Live</button>
        <button type="button" data-mode="clear">Sun</button>
        <button type="button" data-mode="cloudy">Clouds</button>
        <button type="button" data-mode="rain">Rain</button>
        <button type="button" data-mode="storm">Storm</button>
        <button type="button" data-mode="snow">Snow</button>
        <button type="button" data-mode="fog">Fog</button>
      </div>
      <div class="buttons">
        <button type="button" id="daynight">Night</button>
        <button type="button" id="unit"><span class="deg"></span>C</button>
      </div>
    </section>
  </main>

  <p id="hint">Click the critters &middot; drag &amp; toss them &middot; click the sky</p>

  <script src="js/sprites.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
